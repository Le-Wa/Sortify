<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inbox — Sortify</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0c0a;
  --surface:#181512;
  --surface2:#221f1b;
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.12);
  --accent:#c8886a;
  --accent-dim:rgba(200,136,106,.13);
  --accent-border:rgba(200,136,106,.35);
  --text:#f0ece6;
  --text-muted:#8a8278;
  --text-dim:#504a44;
  --danger:rgba(220,80,60,.12);
  --danger-text:#e07755;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
.app{max-width:430px;margin:0 auto;padding-bottom:88px;}

/* Header */
.inbox-header{padding:24px 16px 8px;}
.inbox-section{font-size:12px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.inbox-hero{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;}
.hero-num{font-family:'Fraunces',serif;font-style:italic;font-size:60px;font-weight:700;color:var(--accent);line-height:1;transition:color .3s;}
.hero-num.zero{color:var(--text-dim);}
.hero-label{font-size:15px;color:var(--text-muted);}
.validate-all-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#1a0a04;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:99px;border:none;cursor:pointer;margin-bottom:16px;transition:opacity .15s;}
.validate-all-btn:hover{opacity:.88;}
.validate-all-btn.hidden{display:none;}

/* Filters */
.filters{display:flex;gap:7px;padding:0 16px 16px;overflow-x:auto;}
.filters::-webkit-scrollbar{display:none;}
.filter-pill{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;border:1.5px solid var(--border2);background:transparent;color:var(--text-muted);font-family:'DM Sans',sans-serif;transition:all .15s;}
.filter-pill.active{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);}

/* Playlist dropdown */
.pl-dropdown-wrap{margin:0 12px 16px;position:relative;}
.pl-dropdown-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:13px;color:var(--text-muted);font-family:'DM Sans',sans-serif;transition:border-color .15s;}
.pl-dropdown-btn:hover{border-color:var(--border2);}
.pl-dropdown-arrow{transition:transform .2s;}
.pl-dropdown-arrow.open{transform:rotate(180deg);}
.pl-dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;overflow:hidden;z-index:20;display:none;}
.pl-dropdown-menu.open{display:block;}
.pl-dropdown-item{padding:11px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s;}
.pl-dropdown-item:hover{background:rgba(255,255,255,.04);}
.pl-dropdown-item.active{color:var(--accent);}
.pl-dropdown-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* Cards */
.tracks{padding:0 12px;display:flex;flex-direction:column;gap:10px;}
.track-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:opacity .35s ease,transform .35s ease;animation:slideIn .3s ease both;}
.track-card.dismissing{opacity:0;transform:translateX(48px) scale(.96);pointer-events:none;}
@keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Card header */
.card-top{padding:14px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.track-title{font-size:16px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:3px;}
.track-artist{font-size:13px;color:var(--text-muted);margin-bottom:1px;}
.track-album{font-size:11px;color:var(--text-dim);}
.conf-badge{font-size:11px;padding:4px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.badge-none{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);}
.badge-low{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);}
.badge-vlow{background:var(--danger);color:var(--danger-text);border:1px solid rgba(220,80,60,.25);}

/* Player compact */
.player-wrap{margin:12px 14px 0;}
.player-mock{border-radius:10px;display:flex;align-items:center;gap:10px;padding:9px 11px;overflow:hidden;position:relative;}
.player-art{width:38px;height:38px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.03em;}
.player-meta{flex:1;min-width:0;}
.player-t{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-a{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-play{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:background .15s;}
.player-play:hover{background:#fff;}
.sp-logo{flex-shrink:0;opacity:.7;}

/* Tags */
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0;}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);}

/* Reason */
.reason-toggle{display:flex;align-items:center;gap:6px;padding:10px 14px 0;cursor:pointer;user-select:none;}
.reason-icon{color:var(--text-dim);transition:color .15s;}
.reason-toggle:hover .reason-icon{color:var(--text-muted);}
.reason-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);}
.reason-chevron{color:var(--text-dim);transition:transform .2s;}
.reason-chevron.open{transform:rotate(180deg);}
.reason-body{font-size:13px;color:var(--text-muted);line-height:1.65;padding:0 14px;max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease;}
.reason-body.open{max-height:200px;padding:8px 14px 0;}

/* Playlist selector */
.pl-selector{padding:14px;}
.pl-sec-label{font-size:10px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.pl-card{padding:9px 10px;border-radius:10px;cursor:pointer;border:1.5px solid var(--plb,#333);background:var(--plbg,#1a1a1a);display:flex;align-items:center;gap:7px;transition:background .12s,border-color .12s;}
.pl-dot{width:8px;height:8px;border-radius:50%;background:var(--plb,#555);flex-shrink:0;transition:background .12s;}
.pl-name{font-size:11px;font-weight:500;color:var(--plt,#aaa);line-height:1.3;transition:color .12s;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.pl-card.sel{background:var(--plb,#555)!important;border-color:var(--plb,#555)!important;}
.pl-card.sel .pl-name{color:var(--plts,#fff);}
.pl-card.sel .pl-dot{background:var(--plts,#fff);}
.ai-tag{font-size:9px;padding:1px 5px;border-radius:99px;background:rgba(200,136,106,.18);color:var(--accent);border:1px solid rgba(200,136,106,.3);font-weight:500;}

.fold-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:0;overflow:hidden;transition:max-height .28s ease,margin-top .28s ease;}
.fold-grid.open{max-height:500px;margin-top:7px;}

.see-more{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border-radius:9px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:11px;color:var(--text-dim);font-family:'DM Sans',sans-serif;transition:color .15s,border-color .15s;}
.see-more:hover{color:var(--text-muted);border-color:var(--border2);}
.sm-chevron{display:inline-block;transition:transform .2s;font-size:9px;}
.sm-chevron.open{transform:rotate(180deg);}

/* Card sep */
.card-sep{height:1px;background:var(--border);margin:0 14px;}

/* Actions */
.card-actions{display:flex;gap:8px;padding:12px 14px 14px;}
.assign-btn{flex:1;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;border:none;background:var(--surface2);color:var(--text-dim);cursor:default;font-family:'DM Sans',sans-serif;transition:background .15s,color .15s;white-space:nowrap;}
.assign-btn.ready{background:var(--accent);color:#18090a;cursor:pointer;}
.archive-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:16px;transition:color .15s,border-color .15s;font-family:serif;}
.archive-btn:hover{color:var(--text-muted);border-color:var(--border2);}

/* Empty */
.empty-state{text-align:center;padding:80px 24px 40px;}
.empty-num{font-family:'Fraunces',serif;font-style:italic;font-size:56px;color:var(--text-dim);margin-bottom:8px;}
.empty-msg{font-size:15px;color:var(--text-muted);}

/* Toast */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--border2);border-radius:99px;padding:10px 10px 10px 16px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:200;box-shadow:0 4px 24px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:all;}
.toast-undo{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;padding:4px 8px;}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,10,8,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:8px 0 20px;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;opacity:.35;transition:opacity .15s;min-width:64px;position:relative;}
.nav-item.active{opacity:1;}
.nav-item svg{width:22px;height:22px;}
.nav-lbl{font-size:10px;color:var(--text);}
.nav-item.active .nav-lbl{color:var(--accent);}
.nav-badge{position:absolute;top:-2px;right:12px;background:var(--accent);color:#18090a;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;font-family:'DM Sans',sans-serif;}
</style>
</head>
<body>
<div class="app">
  <div class="inbox-header">
    <div class="inbox-section">Inbox</div>
    <div class="inbox-hero">
      <span class="hero-num" id="hero-count">34</span>
      <span class="hero-label" id="hero-label">tracks à revoir</span>
    </div>
    <button class="validate-all-btn" id="validate-all-btn" onclick="validateAll()">
      Tout valider (+55%)
    </button>
  </div>

  <div class="filters">
    <button class="filter-pill active" onclick="setFilter('all',this)">Tous</button>
    <button class="filter-pill" onclick="setFilter('uncertain',this)">Incertains (&lt;55%)</button>
    <button class="filter-pill" onclick="setFilter('very',this)">Très incertains (&lt;40%)</button>
  </div>

  <div class="pl-dropdown-wrap">
    <button class="pl-dropdown-btn" onclick="toggleDropdown()" id="dropdown-btn">
      <span id="dropdown-label">Toutes les playlists</span>
      <svg class="pl-dropdown-arrow" id="dropdown-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 6 8 10 12 6"/></svg>
    </button>
    <div class="pl-dropdown-menu" id="dropdown-menu">
      <div class="pl-dropdown-item active" onclick="filterByPlaylist(null,this)">
        <div class="pl-dropdown-dot" style="background:var(--text-dim)"></div>Toutes les playlists
      </div>
      <div class="pl-dropdown-item" onclick="filterByPlaylist('electro',this)">
        <div class="pl-dropdown-dot" style="background:#378ADD"></div>Good Electro
      </div>
      <div class="pl-dropdown-item" onclick="filterByPlaylist('techno',this)">
        <div class="pl-dropdown-dot" style="background:#888"></div>Good Techno
      </div>
      <div class="pl-dropdown-item" onclick="filterByPlaylist('vibes',this)">
        <div class="pl-dropdown-dot" style="background:#1D9E75"></div>Good Vibes
      </div>
      <div class="pl-dropdown-item" onclick="filterByPlaylist('afro',this)">
        <div class="pl-dropdown-dot" style="background:#EF9F27"></div>Good Afro
      </div>
      <div class="pl-dropdown-item" onclick="filterByPlaylist('maghreb',this)">
        <div class="pl-dropdown-dot" style="background:#D85A30"></div>Maghreb United
      </div>
      <div class="pl-dropdown-item" onclick="filterByPlaylist('rap',this)">
        <div class="pl-dropdown-dot" style="background:#7F77DD"></div>Rap FR
      </div>
    </div>
  </div>

  <div class="tracks" id="tracks-container"></div>
  <div class="empty-state" id="empty-state" style="display:none">
    <div class="empty-num">✓</div>
    <div class="empty-msg">Inbox vide — tout est classé.</div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toast-msg">Track archivé</span>
  <button class="toast-undo" onclick="undo()">Annuler</button>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="alert('→ Accueil')">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 12L12 3l9 9M5 10v10h5v-5h4v5h5V10"/></svg>
    <span class="nav-lbl">Accueil</span>
  </div>
  <div class="nav-item active">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 8h18M3 12h18M3 16h18"/><circle cx="3" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="16" r="1" fill="currentColor" stroke="none"/></svg>
    <span class="nav-badge" id="nav-badge">34</span>
    <span class="nav-lbl" style="color:var(--accent)">Inbox</span>
  </div>
  <div class="nav-item" onclick="alert('→ Playlists')">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span class="nav-lbl">Playlists</span>
  </div>
  <div class="nav-item" onclick="alert('→ Profil')">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span class="nav-lbl">Walid</span>
  </div>
</div>

<script>
const PL = {
  electro: {name:'Good Electro', plbg:'#0b1e38', plb:'#185FA5', plt:'#85B7EB', plts:'#d4eaf9', dot:'#378ADD'},
  techno:  {name:'Good Techno',  plbg:'#1a1a1e', plb:'#5F5E5A', plt:'#B4B2A9', plts:'#eeecea', dot:'#888'},
  vibes:   {name:'Good Vibes',   plbg:'#082018', plb:'#0F6E56', plt:'#5DCAA5', plts:'#cff0e5', dot:'#1D9E75'},
  afro:    {name:'Good Afro',    plbg:'#271c07', plb:'#BA7517', plt:'#EF9F27', plts:'#fce8c0', dot:'#EF9F27'},
  maghreb: {name:'Maghreb United',plbg:'#281009',plb:'#993C1D', plt:'#F0997B', plts:'#fde0d5', dot:'#D85A30'},
  rap:     {name:'Rap FR',       plbg:'#161238', plb:'#534AB7', plt:'#AFA9EC', plts:'#e8e6fc', dot:'#7F77DD'},
};

const ALL_PL = ['electro','techno','vibes','afro','maghreb','rap'];

const TRACKS_DATA = [
  {
    id:1, title:'ليالي', artist:'U', album:'(ليالي)',
    confidence:null, genres:['rap/hip hop'],
    reason:"Le titre en arabe 'ليالي' (Layali) et le genre rap/hip hop suggèrent un rap arabe qui correspond parfaitement à la collection culturelle MENA de Maghreb United.",
    suggestions:['maghreb','rap'],
    art_bg:'#1e1030', art_color:'#9966cc', initials:'لي'
  },
  {
    id:2, title:'Gotta Learn', artist:'Biga*Ranx', album:'St.Soleil – Tape',
    confidence:42, genres:['reggae','roots'],
    reason:"Les influences reggae de Biga*Ranx et la production organique de St.Soleil – Tape s'alignent avec la chaleur soul de Good Vibes, mais le côté roots reggae crée une ambiguïté avec Good Afro.",
    suggestions:['vibes','afro'],
    art_bg:'#2d1a4a', art_color:'#b88aee', initials:'BR'
  },
  {
    id:3, title:'Émeraude', artist:'Laylow', album:'Trinity',
    confidence:38, genres:['rap fr','trap','experimental'],
    reason:"Laylow est clairement dans le rap FR, mais la production cinématique d'Émeraude hésite entre Rap FR et Good Vibes pour son ambiance introspective très marquée.",
    suggestions:['rap','vibes'],
    art_bg:'#101010', art_color:'#666', initials:'LL'
  },
  {
    id:4, title:'Burning Spear', artist:'Kalash', album:'Moroccan Gigolo',
    confidence:51, genres:['dancehall','afrobeats'],
    reason:"Kalash oscille entre Good Afro (influences afrobeats/dancehall caribéen) et Maghreb United selon les morceaux. Ici les influences afrobeats et la chaleur tropicale dominent.",
    suggestions:['afro','maghreb'],
    art_bg:'#2a1205', art_color:'#e07030', initials:'KL'
  },
  {
    id:5, title:'Joko', artist:'Guts', album:'Groove Education',
    confidence:45, genres:['jazz hip-hop','nu jazz','organic'],
    reason:"Le jazz hip-hop organique de Guts correspond bien à Good Vibes, mais les samples jazz prononcés et le BPM dansant suggèrent également Good Electro pour ses playlists dancefloor.",
    suggestions:['vibes','electro'],
    art_bg:'#0a1e24', art_color:'#3ab8a0', initials:'GU'
  },
  {
    id:6, title:'Balti Ya Balti', artist:'Gnawa Diffusion', album:'Souk System',
    confidence:null, genres:['gnawa','world music','fusion'],
    reason:"Gnawa Diffusion est un cas évident pour Maghreb United. La fusion gnawa-rock et les thèmes culturels maghrébins correspondent exactement à l'identité de la playlist.",
    suggestions:['maghreb'],
    art_bg:'#200a0a', art_color:'#cc4422', initials:'GD'
  },
  {
    id:7, title:'Moleskine', artist:'FKJ', album:'French Kiwi Juice',
    confidence:48, genres:['future bass','neo soul','electronic'],
    reason:"La production de FKJ mêle élégamment l'électronique et l'organique. Moleskine penche vers Good Vibes pour son groove introspectif, mais le BPM et la texture électro pourraient aussi convenir à Good Electro.",
    suggestions:['vibes','electro'],
    art_bg:'#1a1020', art_color:'#8866cc', initials:'FK'
  },
  {
    id:8, title:'Kilindi', artist:'Ninho', album:'JEFE',
    confidence:55, genres:['rap fr','trap fr'],
    reason:"Ninho est clairement dans le rap FR. Kilindi respecte la contrainte d'âge (<3 ans). Confiance limite : le style est très commercial et lisse comparé à d'autres artistes de la playlist.",
    suggestions:['rap'],
    art_bg:'#0a0a18', art_color:'#4466cc', initials:'NI'
  }
];

// State
let state = {
  tracks: TRACKS_DATA.map(t => ({
    ...t,
    selected: new Set([t.suggestions[0]]),
    archived: false,
    validated: false,
  })),
  filter: 'all',
  plFilter: null,
  lastAction: null,
};

function visibleTracks() {
  return state.tracks.filter(t => {
    if (t.archived || t.validated) return false;
    if (state.filter === 'uncertain' && t.confidence !== null && t.confidence >= 55) return false;
    if (state.filter === 'very' && (t.confidence === null || t.confidence >= 40)) return false;
    if (state.plFilter && !t.suggestions.includes(state.plFilter)) return false;
    return true;
  });
}

function plCardStyle(plKey) {
  const p = PL[plKey];
  return `style="--plbg:${p.plbg};--plb:${p.plb};--plt:${p.plt};--plts:${p.plts}"`;
}

function renderPlCard(trackId, plKey, isAI) {
  const p = PL[plKey];
  const t = state.tracks.find(x => x.id === trackId);
  const sel = t.selected.has(plKey) ? 'sel' : '';
  const badge = isAI ? '<span class="ai-tag">IA</span>' : '';
  return `<div class="pl-card ${sel}" ${plCardStyle(plKey)} onclick="togglePl(${trackId},'${plKey}')">
    <div class="pl-dot"></div>
    <div class="pl-name">${p.name}${badge}</div>
  </div>`;
}

function renderCard(track, idx) {
  const conf = track.confidence;
  let badgeClass = 'badge-none';
  let badgeLabel = 'Aucun signal';
  if (conf !== null) {
    badgeClass = conf < 40 ? 'badge-vlow' : 'badge-low';
    badgeLabel = conf + '%';
  }
  const others = ALL_PL.filter(k => !track.suggestions.includes(k));
  const selCount = track.selected.size;

  return `
<div class="track-card" id="card-${track.id}" style="animation-delay:${idx*0.06}s">
  <div class="card-top">
    <div>
      <div class="track-title">${track.title}</div>
      <div class="track-artist">${track.artist}</div>
      <div class="track-album">${track.album}</div>
    </div>
    <div class="conf-badge ${badgeClass}">${badgeLabel}</div>
  </div>

  <div class="player-wrap">
    <div class="player-mock" style="background:${track.art_bg}">
      <div class="player-art" style="background:${track.art_color}22;color:${track.art_color}">${track.initials}</div>
      <div class="player-meta">
        <div class="player-t">${track.title}</div>
        <div class="player-a">${track.artist}</div>
      </div>
      <svg class="sp-logo" width="20" height="20" viewBox="0 0 24 24" fill="${track.art_color}">
        <circle cx="12" cy="12" r="12" fill="#1DB954"/><path d="M17.9 10.9C14.7 9 9.35 8.8 6.3 9.75c-.5.15-1-.15-1.15-.6-.15-.5.15-1 .6-1.15 3.55-1.05 9.4-.85 13.1 1.35.45.25.6.85.35 1.3-.25.35-.85.5-1.3.25zm-.1 2.8c-.25.35-.7.5-1.05.25-2.7-1.65-6.8-2.15-9.95-1.15-.4.1-.85-.1-.95-.5-.1-.4.1-.85.5-.95 3.65-1.1 8.15-.55 11.25 1.35.3.15.45.65.2 1zm-1.2 2.75c-.2.3-.55.4-.85.2-2.35-1.45-5.3-1.75-8.8-.95-.35.1-.65-.15-.75-.45-.1-.35.15-.65.45-.75 3.8-.85 7.1-.5 9.7 1.1.35.15.4.55.25.85z" fill="white"/>
      </svg>
      <div class="player-play" onclick="alert('Preview non disponible en mode dev Spotify')">
        <svg width="13" height="13" viewBox="0 0 12 12" fill="#111"><path d="M2.5 1.5l8 4.5-8 4.5V1.5z"/></svg>
      </div>
    </div>
  </div>

  <div class="tags">
    ${track.genres.map(g => `<span class="tag">${g}</span>`).join('')}
  </div>

  <div class="reason-toggle" onclick="toggleReason(${track.id})">
    <svg class="reason-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span class="reason-lbl">Raison</span>
    <svg class="reason-chevron" id="rchev-${track.id}" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  <div class="reason-body" id="reason-${track.id}">${track.reason}</div>

  <div class="pl-selector">
    <div class="pl-sec-label">Suggestions IA</div>
    <div class="pl-grid">
      ${track.suggestions.map(k => renderPlCard(track.id, k, true)).join('')}
    </div>
    ${others.length > 0 ? `
    <div class="fold-grid" id="fold-${track.id}">
      ${others.map(k => renderPlCard(track.id, k, false)).join('')}
    </div>
    <button class="see-more" id="sm-${track.id}" onclick="toggleFold(${track.id})">
      <span class="sm-chevron" id="smchev-${track.id}">▼</span>
      <span id="sm-label-${track.id}">Voir ${others.length} autres playlists</span>
    </button>` : ''}
  </div>

  <div class="card-sep"></div>
  <div class="card-actions">
    <button class="assign-btn ${selCount > 0 ? 'ready' : ''}" id="abtn-${track.id}" onclick="assign(${track.id})">
      ${selCount === 0 ? 'Assigner' : `Assigner (${selCount} playlist${selCount > 1 ? 's' : ''})`}
    </button>
    <button class="archive-btn" onclick="archive(${track.id})" title="Archiver">∅</button>
  </div>
</div>`;
}

function renderAll() {
  const visible = visibleTracks();
  const container = document.getElementById('tracks-container');
  container.innerHTML = visible.map((t, i) => renderCard(t, i)).join('');
  updateHeader();
  document.getElementById('empty-state').style.display = visible.length === 0 ? 'block' : 'none';
}

function updateHeader() {
  const n = visibleTracks().length;
  const total = state.tracks.filter(t => !t.archived && !t.validated).length;
  document.getElementById('hero-count').textContent = n;
  document.getElementById('hero-count').className = 'hero-num' + (n === 0 ? ' zero' : '');
  document.getElementById('hero-label').textContent = n === 1 ? 'track à revoir' : 'tracks à revoir';
  document.getElementById('nav-badge').textContent = total;
  if (total === 0) document.getElementById('validate-all-btn').classList.add('hidden');
}

function togglePl(trackId, plKey) {
  const t = state.tracks.find(x => x.id === trackId);
  if (t.selected.has(plKey)) t.selected.delete(plKey);
  else t.selected.add(plKey);
  // Update card
  const card = document.getElementById('card-' + trackId);
  const cards = card.querySelectorAll('.pl-card');
  cards.forEach(c => {
    const onclick = c.getAttribute('onclick');
    if (onclick && onclick.includes(`'${plKey}'`)) {
      c.classList.toggle('sel', t.selected.has(plKey));
    }
  });
  const btn = document.getElementById('abtn-' + trackId);
  const n = t.selected.size;
  btn.className = 'assign-btn' + (n > 0 ? ' ready' : '');
  btn.textContent = n === 0 ? 'Assigner' : `Assigner (${n} playlist${n > 1 ? 's' : ''})`;
}

function assign(trackId) {
  const t = state.tracks.find(x => x.id === trackId);
  if (t.selected.size === 0) return;
  const names = [...t.selected].map(k => PL[k].name).join(', ');
  state.lastAction = { type: 'assign', trackId, prevState: { selected: new Set(t.selected), validated: t.validated } };
  t.validated = true;
  dismissCard(trackId, () => renderAll());
  showToast(`"${t.title}" → ${names}`, true);
}

function archive(trackId) {
  const t = state.tracks.find(x => x.id === trackId);
  state.lastAction = { type: 'archive', trackId, prevState: { archived: t.archived } };
  t.archived = true;
  dismissCard(trackId, () => renderAll());
  showToast(`"${t.title}" archivé`, true);
}

function dismissCard(trackId, cb) {
  const card = document.getElementById('card-' + trackId);
  if (card) {
    card.classList.add('dismissing');
    setTimeout(cb, 350);
  } else cb();
}

function undo() {
  if (!state.lastAction) return;
  const { type, trackId, prevState } = state.lastAction;
  const t = state.tracks.find(x => x.id === trackId);
  if (type === 'assign') { t.validated = prevState.validated; t.selected = prevState.selected; }
  else if (type === 'archive') { t.archived = prevState.archived; }
  state.lastAction = null;
  hideToast();
  renderAll();
}

function validateAll() {
  const visible = visibleTracks();
  visible.forEach(t => { t.validated = true; });
  renderAll();
  showToast(`${visible.length} tracks validés`, false);
}

function toggleReason(trackId) {
  const body = document.getElementById('reason-' + trackId);
  const chev = document.getElementById('rchev-' + trackId);
  const open = body.classList.toggle('open');
  chev.classList.toggle('open', open);
}

function toggleFold(trackId) {
  const fold = document.getElementById('fold-' + trackId);
  const chev = document.getElementById('smchev-' + trackId);
  const lbl = document.getElementById('sm-label-' + trackId);
  const isOpen = fold.classList.toggle('open');
  chev.classList.toggle('open', isOpen);
  const n = fold.querySelectorAll('.pl-card').length;
  lbl.textContent = isOpen ? 'Réduire' : `Voir ${n} autres playlists`;
}

function setFilter(f, btn) {
  state.filter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function filterByPlaylist(plKey, item) {
  state.plFilter = plKey;
  document.querySelectorAll('.pl-dropdown-item').forEach(i => i.classList.remove('active'));
  item.classList.add('active');
  const label = document.getElementById('dropdown-label');
  label.textContent = plKey ? PL[plKey].name : 'Toutes les playlists';
  toggleDropdown();
  renderAll();
}

function toggleDropdown() {
  const menu = document.getElementById('dropdown-menu');
  const arrow = document.getElementById('dropdown-arrow');
  const open = menu.classList.toggle('open');
  arrow.classList.toggle('open', open);
  if (open) {
    setTimeout(() => document.addEventListener('click', closeDropdown, {once:true}), 10);
  }
}
function closeDropdown(e) {
  const menu = document.getElementById('dropdown-menu');
  const btn = document.getElementById('dropdown-btn');
  if (!menu.contains(e.target) && !btn.contains(e.target)) {
    menu.classList.remove('open');
    document.getElementById('dropdown-arrow').classList.remove('open');
  }
}

let toastTimer;
function showToast(msg, showUndo) {
  clearTimeout(toastTimer);
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.querySelector('.toast-undo').style.display = showUndo ? 'inline' : 'none';
  toast.classList.add('show');
  toastTimer = setTimeout(hideToast, 4000);
}
function hideToast() {
  document.getElementById('toast').classList.remove('show');
}

renderAll();
</script>
</body>
</html>
