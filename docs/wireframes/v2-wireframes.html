<title>Sortify V2 Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: plan d'écrans à gauche, téléphone cliquable au centre, annotations à droite. Volontairement sans style : niveaux de gris + une couleur "annotation". */
:root{
  --bg:#eeeeec; --paper:#ffffff; --ink:#1d1d1b; --mid:#62625e; --dim:#9a9a95;
  --line:#d4d4d0; --fill:#e6e6e3; --fill2:#f4f4f2; --note:#2f5bd3; --note-bg:#e8eefc;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161615; --paper:#212120; --ink:#ececea; --mid:#a6a6a1; --dim:#74746f;
  --line:#3a3a38; --fill:#2e2e2c; --fill2:#272725; --note:#8fa9f5; --note-bg:#1f2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161615; --paper:#212120; --ink:#ececea; --mid:#a6a6a1; --dim:#74746f;
  --line:#3a3a38; --fill:#2e2e2c; --fill2:#272725; --note:#8fa9f5; --note-bg:#1f2840; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:24px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--note);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:220px 380px minmax(0,1fr);gap:32px;align-items:start}
header.top{max-width:1180px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
header.top h1{font-size:22px;margin:0;letter-spacing:-.2px;text-wrap:balance}
header.top p{margin:0;color:var(--mid);max-width:60ch}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--note)}

/* Plan des écrans */
nav.flow{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.flow-group{display:flex;flex-direction:column;gap:2px}
.flow-group h3{margin:0 0 4px;font-size:11px;font-family:var(--mono);font-weight:500;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.flow button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;color:var(--mid);min-height:36px;align-items:center}
.flow button:hover{background:var(--fill)}
.flow button[aria-current="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.flow .k{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:400}

/* Téléphone */
.phone{width:100%;max-width:380px;height:760px;background:var(--paper);border:1.5px solid var(--ink);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-family:var(--mono);font-size:11px;color:var(--mid)}
.screen{flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-bottom:10px}
.tabs button{background:none;border:0;padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);min-height:52px}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:600}
.tabs .ico{width:22px;height:22px;border:1.5px solid currentColor;border-radius:6px;position:relative}
.badge{position:absolute;top:-7px;right:-11px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:600;border-radius:10px;padding:0 5px;line-height:16px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--paper);border-radius:10px;padding:11px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* Primitives wireframe */
.h1{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.3px;margin:0;text-wrap:balance}
.h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--mid);margin:0}
.meta{font-size:12px;color:var(--dim);margin:0}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;padding:0 16px;width:100%}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--mid);font-weight:500}
.btn-sm{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:0 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.box.off{opacity:.45}
.cover{flex:none;width:44px;height:44px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--fill) 0 6px,var(--fill2) 6px 12px);border:1px solid var(--line)}
.cover.xl{width:100%;height:auto;aspect-ratio:1;border-radius:14px;max-width:100%}
.track{display:flex;gap:12px;align-items:center;min-width:0}
.track .t{min-width:0;flex:1}
.track .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .t span{display:block;font-size:12px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mid);background:var(--fill2)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--paper);text-align:left;width:100%}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--fill2)}
.pick .pct{font-family:var(--mono);font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums}
.check{width:20px;height:20px;border:1.5px solid var(--dim);border-radius:6px;flex:none;display:grid;place-items:center;font-size:13px;line-height:1}
.pick[aria-pressed="true"] .check{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.list{display:flex;flex-direction:column}
.list>*{border-bottom:1px solid var(--line);padding:12px 0}
.list>*:last-child{border-bottom:0}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .4s}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;color:var(--dim)}
.step.done,.step.now{color:var(--ink)}
.step .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px}
.step.done .dot{background:var(--ink);color:var(--paper)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--fill);border:1px solid var(--line);position:relative;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--line);transition:.15s}
.toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.toggle[aria-pressed="true"]::after{left:20px}
.back{background:none;border:0;padding:8px 0;color:var(--mid);text-align:left;min-height:44px;align-self:flex-start}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--fill2);color:var(--ink);resize:vertical}
select{font:inherit;color:inherit;background:var(--fill2);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px}
.spacer{flex:1}
.tabsrow{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.tabcard{flex:none;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;min-height:44px}
.tabcard .tab{align-self:flex-start;background:var(--fill);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tabcard .tabbody{background:var(--fill);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:10px;width:120px;font-size:12px;color:var(--mid)}
.swipe{position:relative;touch-action:pan-y;cursor:grab;user-select:none}
.swipe .cover{transition:transform .2s}
.swipe-tag{position:absolute;top:14px;font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:6px;background:var(--ink);color:var(--paper);opacity:0;transition:opacity .15s}
.swipe-tag.l{left:14px}.swipe-tag.r{right:14px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:5;border:0}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-radius:20px 20px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.crate{height:150px;overflow:hidden;position:relative;margin:0 -20px}
.crate-track{display:flex;gap:10px;position:absolute;left:50%;top:10px;transition:transform .5s ease}
.crate-track .cover{width:120px;height:120px;border-radius:8px;flex:none;transition:transform .5s,opacity .5s;opacity:.35;transform:scale(.82)}
.crate-track .cover.on{opacity:1;transform:scale(1)}
.wm{font-weight:700;font-size:15px;letter-spacing:.5px;font-family:var(--mono)}
.mark{font-family:var(--mono);font-size:10px;color:var(--note);border:1px dashed var(--note);border-radius:4px;padding:1px 5px;white-space:nowrap}

/* Annotations */
aside.notes{display:flex;flex-direction:column;gap:18px;min-width:0}
.note-head h2{font-size:20px;margin:4px 0 6px;text-wrap:balance}
.note-head p{margin:0;color:var(--mid);max-width:60ch}
.nb{background:var(--note-bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.nb h4{margin:0;font-size:11px;font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--note)}
.nb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;max-width:62ch}
.legend{font-size:12px;color:var(--dim);max-width:60ch}

@media (max-width:1100px){.wrap{grid-template-columns:200px 380px;}.notes{grid-column:1/-1}}
@media (max-width:680px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:20px}
  nav.flow{position:static;flex-direction:row;overflow-x:auto;gap:16px;padding-bottom:4px}
  .flow-group{flex:none}
  .flow-group>div{display:flex;gap:2px}
  .flow button{white-space:nowrap}
  .phone{margin:0 auto;height:700px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div>
    <div class="tag">Sortify · V2 · wireframes basse fidélité</div>
    <h1>Le parcours en 6 écrans</h1>
  </div>
  <p>Aucun choix visuel ici : on valide l'enchaînement, le contenu et les actions. Tout est cliquable. Les titres et chiffres sont des exemples.</p>
</header>

<div class="wrap">
  <nav class="flow" id="flow" aria-label="Écrans"></nav>
  <div>
    <div class="phone" id="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="screen" id="screen"></div>
      <div class="tabs" id="tabs" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
const PL = [
  {id:"soiree",  name:"Soirée potes",      axe:"moment",   n:212, pitch:"Énergie haute, refrains à crier, pour lancer la soirée.", brief:"Titres dansants et fédérateurs, tempo 115–128, voix présentes. Pop, house vocale, afro, rap festif. Pas de morceaux lents ni de techno instrumentale sombre.", ex:["Fred again.. — Delilah","Kaytranada — 10%","Polo & Pan — Canopée"]},
  {id:"dimanche",name:"Dimanche lent",     axe:"ambiance", n:168, pitch:"Acoustique, chaud, rien ne presse.", brief:"Guitares, voix douces, soul et folk feutrés, psyché tranquille. Énergie basse, beaucoup d'acoustique. Frontière : le jazz instrumental va plutôt dans Focus.", ex:["Khruangbin — Time (You and I)","Men I Trust — Show Me How","Nick Hakim — Bet She Looks Like You"]},
  {id:"club",    name:"Club 2h du mat'",   axe:"scène",    n:241, pitch:"House et techno qui tapent, peu de paroles.", brief:"House, techno, UK garage, breaks. Kick 4/4 dominant, longues montées. Exclure les remixes pop radio.", ex:["Bicep — Glue","Floating Points — LesAlpx","Peggy Gou — Starry Night"]},
  {id:"rap",     name:"Rap introspectif",  axe:"scène",    n:139, pitch:"Le texte avant tout, des prods posées.", brief:"Rap FR et UK/US conscient ou mélancolique, prods minimalistes ou soul. Exclure les morceaux de club/drill très énergiques.", ex:["Little Simz — Introvert","Damso — Θ. Macarena","Kendrick Lamar — FEAR."]},
  {id:"soul",    name:"Soul nocturne",     axe:"scène",    n:187, pitch:"R&B et soul pour la nuit, voix au premier plan.", brief:"R&B moderne, néo-soul, slow jams. Ambiance nuit, sensuelle. Frontière avec Dimanche lent : ici plus de basses et de production.", ex:["SZA — Good Days","Daniel Caesar — Get You","Cleo Sol — Why Don't You"]},
  {id:"solaire", name:"Électro solaire",   axe:"ambiance", n:176, pitch:"Électro mélodique et lumineuse.", brief:"Électro-pop, nu-disco, house mélodique. Valence haute, synthés brillants. Moins frontal que Club 2h du mat'.", ex:["Polo & Pan — Ani Kuni","Parcels — Tieduprightnow","Jungle — Back On 74"]},
  {id:"afro",    name:"Afro & groove",     axe:"scène",    n:124, pitch:"Afrobeats, amapiano, ça balance.", brief:"Afrobeats, amapiano, afro-house, highlife moderne. Groove avant la puissance.", ex:["Burna Boy — Last Last","Tems — Free Mind","Uncle Waffles — Tanzania"]},
  {id:"route",   name:"Route",             axe:"moment",   n:151, pitch:"Pour rouler longtemps, grands espaces.", brief:"Rock psyché, synth-pop, indie ample. Tempo régulier, morceaux longs qui montent.", ex:["Tame Impala — Let It Happen","M83 — Midnight City","The War On Drugs — Red Eyes"]},
  {id:"focus",   name:"Focus",             axe:"moment",   n:138, pitch:"Instrumental et calme, pour bosser.", brief:"Instrumental uniquement : ambient, néo-classique, downtempo, jazz calme. Pas de voix lead.", ex:["Nils Frahm — Says","Bonobo — Kerala","Tycho — Awake"]},
];
const DIVERS = {id:"divers", name:"Divers", n:61, pitch:"Les titres qui n'ont trouvé leur place nulle part.", brief:"Sortify y repasse à chaque nouvelle analyse : si une playlist apparaît qui leur correspond, ils déménagent.", ex:["Nina Simone — Sinnerman","Daft Punk — Contact","Ennio Morricone — L'estasi dell'oro"]};
const QUEUE0 = [
  {t:"Can I Call You Rose?", a:"Thee Sacred Souls", why:"Voix soul vintage et tempo lent : entre la nuit et le dimanche.", sug:[["soul",54],["dimanche",48]]},
  {t:"So U Kno", a:"Overmono", why:"UK garage énergique avec un refrain chanté : club ou soirée.", sug:[["club",52],["soiree",46],["solaire",31]]},
  {t:"River", a:"Ibeyi", why:"Percussions afro-cubaines mais ambiance calme et acoustique.", sug:[["dimanche",41],["afro",38]]},
];
const RECENT0 = [
  {t:"Witchy", a:"Kaytranada, Childish Gambino", to:["soiree","solaire"]},
  {t:"Gorilla", a:"Little Simz", to:["rap"]},
  {t:"Space 1.8", a:"Nala Sinephro", to:["focus","dimanche"]},
  {t:"Baby again..", a:"Fred again.., Skrillex, Four Tet", to:["club","soiree"]},
];

const S = {
  playing:false, why:false, sugg:"open", merge:null, merged:{}, fix:null, fixSel:new Set(),
  screen:"login", keep:Object.fromEntries(PL.map(p=>[p.id,true])), names:{}, regen:{},
  queue:QUEUE0.map(q=>({...q,sel:new Set([q.sug[0][0]])})), qi:0,
  recent:RECENT0.map(r=>({...r,undone:false})), plId:"soiree", editBrief:false, auto:{}, hour:"08:00",
  sorting:false, timer:null,
};
const byId = id => id==="divers" ? DIVERS : PL.find(p=>p.id===id);
const nameOf = id => S.names[id] || byId(id).name;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pending = () => S.queue.length - S.qi;

const SCREENS = [
  {g:"Entrée", items:[["login","Connexion","1"],["invite","Code d'invitation","1b"]]},
  {g:"Révélation · une fois", items:[["analyse","Analyse en cours","2a"],["propose","Proposition","2b"],["create","Création","2c"]]},
  {g:"Au quotidien", items:[["home","Accueil","3"],["triage","À trier","4"],["playlists","Playlists","5"],["playlist","Détail playlist","5b"],["settings","Réglages","6"]]},
];

const NOTES = {
  login:{t:"Connexion", p:"Ce que fait l'app en 3 étapes, puis un seul bouton.", v:["Les 3 étapes (décidé).","Rassurance : « Tes playlists actuelles ne sont pas touchées » (décidé).","Les nouveaux passent par « J'ai un code d'invitation »."], q:["Le wording des 3 étapes te va ?"]},
  invite:{t:"Code d'invitation", p:"Pour un pote qui arrive pour la première fois. Tu génères le code depuis tes Réglages.", v:["Un code = une personne, utilisable une fois.","Contrainte Spotify (mode dev) : tu dois aussi ajouter son compte dans ton dashboard Spotify. Sortify te le rappelle et te donne son email."], q:["Faut-il que le pote saisisse son email Spotify ici pour que tu l'ajoutes, ou tu gères en direct avec lui ?"]},
  analyse:{t:"Analyse en cours", p:"Ça prend 1 à 3 minutes. On feuillette tes vraies pochettes, comme on fouille un bac.", v:["Pochettes qui défilent + le titre en cours + une ligne d'étape (décidé).","On peut quitter : l'analyse continue côté serveur, on retombe sur la proposition en revenant (décidé).","Petite bibliothèque : si moins de ~300 likes sur 2 ans, on remonte plus loin ; si ça reste petit, l'IA propose moins de bacs (décidé)."], q:["Le défilement doit-il suivre l'ordre réel de l'analyse, ou juste être un effet (plus simple) ?"]},
  propose:{t:"Proposition", p:"Le moment clé : « voici l'âme de ta bibliothèque ». On ajuste sans jamais éditer de règles.", v:["Par bac : garder/retirer, renommer, autre idée, fusionner avec un autre (décidé).","Type de bac (scène / ambiance / moment) en étiquette discrète (décidé).","5 pochettes d'exemple, sans texte (décidé).","« Il manque un bac ? » en texte libre dès la V1 (décidé).","Nombre de bacs choisi par l'IA, plus Divers. Un titre peut être dans 3 bacs max."], q:["Fusion : l'IA réécrit la fiche et propose un nom, modifiable (décidé).","Toucher une pochette lance un extrait de 30 s (décidé)."]},
  create:{t:"Création", p:"Sortify crée les playlists dans Spotify et les remplit avec tes likes existants.", v:["Les bacs se remplissent un par un, compteur qui monte (décidé).","Noms seuls dans Spotify, sans suffixe (décidé).","À la fin : « Voir mes bacs » → Accueil (décidé)."], q:["Si Spotify échoue sur un bac (quota, réseau) : on réessaie en silence, ou on le signale à la fin ?"]},
  home:{t:"Accueil", p:"Répond en 2 secondes à « y a-t-il quelque chose à faire ? », puis laisse repartir.", v:["La phrase d'état change : X titres à trier / Tout est rangé.","Suggestion de nouveau bac quand Divers grossit (ré-analyse automatique).","Rangements du dernier tri seulement, même quand il n'y a rien à trier (décidé).","« Corriger » ouvre directement le choix des bacs, en bottom sheet (décidé).","Rangée d'intercalaires en bas pour accéder aux bacs (décidé)."], q:["Ordre de la rangée de bacs : par activité récente, ou ordre fixe ?"]},
  triage:{t:"À trier", p:"Un titre à la fois. Sortify pré-coche sa meilleure idée ; tu confirmes en un geste ou tu corriges.", v:["Swipe droite = ranger dans les bacs cochés, swipe gauche = Divers ; les boutons restent là (décidé).","Extrait au tap seulement (décidé).","Pas de « Passer » : « Je ne sais pas » envoie dans Divers (décidé).","Jusqu'à 3 bacs cochables. Ta correction devient un exemple : l'IA apprend.","« Pourquoi ? » déplie la raison de l'IA."], q:["Si 40 titres attendent (retour de vacances) : tout trier d'un coup, ou proposer « tout accepter les suggestions » ?"]},
  playlists:{t:"Playlists", p:"La liste des playlists gérées par Sortify, Divers en dernier.", v:["Le compteur et les ajouts récents donnent la vie de chaque playlist.","Pas de réordonnancement ni de couleurs en V1."], q:["Divers : la mettre à part visuellement (c'est un choix qui t'agace, on peut en faire un objet à part, type « bac de sortie »)."]},
  playlist:{t:"Détail playlist", p:"Ce que Sortify cherche ici, en clair, modifiable. Plus les titres exemples qui servent d'ancres.", v:["Le « brief » est lisible et modifiable en texte libre.","Désactiver le remplissage auto sans supprimer.","« Retirer de Sortify » laisse la playlist dans Spotify."], q:["Pouvoir retirer un titre de la playlist depuis ici ? (= correction, l'IA apprend)"]},

let toastT;

function renderTabs(){

function afterRender(){
  if(S.screen==="analyse"){
    const tracks=["Khruangbin — Time (You and I)","Little Simz — Introvert","Bicep — Glue","SZA — Good Days","Polo & Pan — Canopée","Burna Boy — Last Last","Nils Frahm — Says","Tame Impala — Let It Happen","Kaytranada — 10%","Men I Trust — Show Me How","Damso — Θ. Macarena","Peggy Gou — Starry Night"];
    const steps=["Lecture de tes likes…","Genres, époques, artistes…","Énergie et ambiances…","On imagine tes bacs…"];
    const crate=document.getElementById("crate");
    crate.innerHTML=tracks.map(()=>'<div class="cover"></div>').join("");
    let i=0; const N=tracks.length*2;
    const draw=()=>{
      const k=i%tracks.length;
      [...crate.children].forEach((c,n)=>c.classList.toggle("on",n===k));
      crate.style.transform=`translateX(${-(k*130+60)}px)`;
      document.getElementById("nowt").textContent=tracks[k];
      document.getElementById("nowc").textContent=`titre ${Math.round((i+1)/N*1248).toLocaleString("fr-FR")} / 1 248`;
      document.getElementById("stepline").textContent=steps[Math.min(steps.length-1,Math.floor(i/N*steps.length))];
      document.getElementById("pbar").style.width=((i+1)/N*100)+"%";
    }; draw();
    S.timer=setInterval(()=>{ i++; if(i>=N){clearInterval(S.timer);S.timer=null;go("propose");return;} draw(); },450);
  }
  if(S.screen==="triage" && document.getElementById("swipe")){
    const el=document.getElementById("swipe"), card=el.querySelector(".cover"), L=el.querySelector(".l"), R=el.querySelector(".r");
    let x0=null, dx=0;
    el.onpointerdown=e=>{ x0=e.clientX; el.setPointerCapture(e.pointerId); card.style.transition="none"; };
    el.onpointermove=e=>{ if(x0===null) return; dx=e.clientX-x0; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; L.style.opacity=dx<-30?1:0; R.style.opacity=dx>30?1:0; };
    el.onpointerup=()=>{ card.style.transition=""; const d=dx; x0=null; dx=0; card.style.transform=""; L.style.opacity=R.style.opacity=0;
      if(d>90){ const q=S.queue[S.qi]; if(q.sel.size){ toast(`Rangé dans ${[...q.sel].map(nameOf).join(", ")}`); S.qi++; S.why=false; S.playing=false; render(); } else toast("Choisis au moins un bac"); }
      else if(d<-90){ toast("Rangé dans Divers"); S.qi++; S.why=false; S.playing=false; render(); } };
  }
  if(S.screen==="create"){
    const bins=PL.filter(p=>S.keep[p.id]); let b=0, n=0;
    S.timer=setInterval(()=>{
      const p=bins[b]; if(!p) return;
      n=Math.min(p.n,n+Math.ceil(p.n/4));
      const el=document.querySelector(`[data-bin="${p.id}"]`); if(el){ el.textContent=n>=p.n?`✓ ${p.n} titres`:`${n} / ${p.n}`; el.style.color=n>=p.n?"var(--ink)":""; }
      if(n>=p.n){ b++; n=0; }
      if(b>=bins.length){ clearInterval(S.timer); S.timer=null; document.getElementById("ctitle").textContent=`${bins.length} bacs prêts dans Spotify.`; document.getElementById("cbtn").hidden=false; }
    },120);
  }

}

function render(){ renderFlow(); renderNotes(); document.getElementById("screen").innerHTML=V[S.screen](); renderTabs(); afterRender(); }

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.go) return go(d.go);
  if(d.keep){ S.keep[d.keep]=!S.keep[d.keep]; return render(); }
  if(d.rename){ const alt={soiree:"Apéro qui déborde",dimanche:"Café crème",club:"Sous-sol",rap:"Carnet de notes",soul:"Minuit soul",solaire:"Plein soleil",afro:"Pas chassés",route:"Autoroute du Sud",focus:"Tête dans le guidon"}; S.names[d.rename]=S.names[d.rename]?null:alt[d.rename]; if(!S.names[d.rename]) delete S.names[d.rename]; toast("Dans l'app : champ texte. Ici : nom d'exemple."); return render(); }
  if(d.play!==undefined){ toast("▶ Extrait de 30 s"); return; }
  if(d.merge){ S.merge=d.merge; return render(); }
  if(d.mergeto){ const a=byId(S.merge), b=byId(d.mergeto); b.n=Math.round((a.n+b.n)*0.85); S.names[b.id]=([a.id,b.id].sort().join()==="dimanche,soul")?"Soul du dimanche soir":nameOf(b.id)+" élargi"; b.pitch=a.pitch.replace(/\.$/,"")+", et "+b.pitch.charAt(0).toLowerCase()+b.pitch.slice(1); S.merged[a.id]=true; S.keep[a.id]=false; S.merge=null; toast("Bacs fusionnés. L'IA propose ce nom, modifiable."); return render(); }
  if(d.regen){ S.regen[d.regen]=true; toast("Nouvelle proposition pour cette playlist"); return render(); }
  if(d.undo){ S.fix=+d.undo; S.fixSel=new Set(S.recent[S.fix].to); return render(); }
  if(d.fixpick){ if(S.fixSel.has(d.fixpick)) S.fixSel.delete(d.fixpick); else if(d.fixpick==="divers") S.fixSel=new Set(["divers"]); else { S.fixSel.delete("divers"); if(S.fixSel.size<3) S.fixSel.add(d.fixpick); else toast("3 bacs maximum"); } return render(); }
  if(d.pick){ const q=S.queue[S.qi]; if(q.sel.has(d.pick)) q.sel.delete(d.pick); else if(q.sel.size<3) q.sel.add(d.pick); else toast("3 playlists maximum"); return render(); }
  if(d.pl){ S.plId=d.pl; S.editBrief=false; return go("playlist"); }
  if(d.auto){ S.auto[d.auto]=S.auto[d.auto]===false; return render(); }
  switch(b.id){
    case "validate": { S.why=false; S.playing=false; if(!S.queue[S.qi].sel.size) return; const q=S.queue[S.qi]; toast(`Rangé dans ${[...q.sel].map(nameOf).join(", ")}`); S.qi++; return render(); }
    case "todivers": toast("Rangé dans Divers"); S.qi++; S.why=false; S.playing=false; return render();
    case "play": S.playing=!S.playing; toast(S.playing?"▶ Extrait de 30 s":"Pause"); return render();
    case "mkcode": toast("Code DISQ-7K2P créé. Pense à ajouter son compte dans ton dashboard Spotify."); return;
    case "mergecancel": S.merge=null; return render();
    case "askgo": if(!PL.find(p=>p.id==="sport")){ PL.push({id:"sport",name:"Séance de sport",axe:"moment",n:94,pitch:"Tempo élevé, basses lourdes, zéro temps mort.",brief:"Titres à 125+ BPM, énergie très haute : rap énergique, drum & bass, house qui tape. Exclure les morceaux lents ou à longue intro.",ex:["Skrillex — Rumble","Little Simz — Gorilla","Overmono — So U Kno"]}); S.keep.sport=true; S.regen.sport=true; toast("Nouveau bac ajouté : Séance de sport (94 titres)"); } return render();
    case "fixsave": { const r=S.recent[S.fix]; r.to=[...S.fixSel]; r.fixed=true; S.fix=null; toast("Corrigé dans Spotify"); return render(); }
    case "why": S.why=!S.why; return render();
    case "sugyes": S.sugg="done"; PL.push({id:"jazz",name:"Jazz du soir",axe:"ambiance",n:18,pitch:"Jazz vocal, contrebasse, ambiance feutrée.",brief:"Jazz vocal et instrumental feutré, tempo lent à moyen. Frontière : le jazz très calme sans voix va dans Focus.",ex:["Nina Simone — Sinnerman","Gregory Porter — Liquid Spirit","Melody Gardot — Baby I'm a Fool"]}); S.keep.jazz=true; DIVERS.n-=18; toast("« Jazz du soir » créée dans Spotify, 18 titres quittent Divers"); return render();
    case "sugno": S.sugg="done"; toast("Suggestion écartée"); return render();
    case "skip": toast("Passé, il reviendra plus tard"); S.qi++; return render();
    case "other": toast("Ouvre la liste de toutes les playlists (bottom sheet)"); return;
    case "resetq": S.queue=QUEUE0.map(q=>({...q,sel:new Set([q.sug[0][0]])})); S.qi=0; return render();
    case "editb": S.editBrief=!S.editBrief; if(!S.editBrief) toast("Brief enregistré, utilisé dès le prochain tri"); return render();
    case "sortnow": S.sorting=true; render(); setTimeout(()=>{S.sorting=false; S.recent.unshift({t:"Selfless",a:"The Strokes",to:["route"],undone:false}); toast("1 nouveau titre rangé"); if(S.screen==="home") render();},1400); return;
  }
});
document.addEventListener("click",e=>{ if(e.target.id==="fixclose"){ S.fix=null; render(); } });
document.addEventListener("change",e=>{ if(e.target.id==="hour"){ S.hour=e.target.value; toast(`Tri quotidien à ${S.hour}`);} });
try{ const h=location.hash.slice(1); if(NOTES[h]) S.screen=h; }catch(_){}
render();
</script>
